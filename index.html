<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Réviser La Nature</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout : une colonne de lecture centrée ; accueil = plage de cours + grille de modules ; quiz = carte unique sous une barre fixe */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface2:#E8ECF4; --fg:#161B2E; --muted:#59617A; --line:#D3DAE8;
  --accent:#3B4BA8; --accent-fg:#FFFFFF; --accent-soft:#E2E6F8;
  --ok:#17794A; --ok-soft:#DCF2E6; --bad:#B3321F; --bad-soft:#FBE3DE; --mid:#8A5A00; --mid-soft:#FAEDCB;
  --lv1:#17794A; --lv2:#2B62C4; --lv3:#A15F08; --lv4:#7A3FB0;
  --font-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-read:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B30; --surface2:#20253F; --fg:#E9ECF7; --muted:#9AA3C0; --line:#2D3354;
  --accent:#95A2FF; --accent-fg:#0E1120; --accent-soft:#232A55;
  --ok:#5ED39A; --ok-soft:#14352A; --bad:#FF8E7B; --bad-soft:#3A1C19; --mid:#F0C25E; --mid-soft:#382C10;
  --lv1:#5ED39A; --lv2:#7FA8F5; --lv3:#F0B15A; --lv4:#C19BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B30; --surface2:#20253F; --fg:#E9ECF7; --muted:#9AA3C0; --line:#2D3354;
  --accent:#95A2FF; --accent-fg:#0E1120; --accent-soft:#232A55;
  --ok:#5ED39A; --ok-soft:#14352A; --bad:#FF8E7B; --bad-soft:#3A1C19; --mid:#F0C25E; --mid-soft:#382C10;
  --lv1:#5ED39A; --lv2:#7FA8F5; --lv3:#F0B15A; --lv4:#C19BF0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem 1rem;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:.35rem .75rem;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* Accueil */
.top{padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:18px}
.top h1{font-family:var(--font-read);font-size:clamp(1.8rem,5vw,2.5rem);font-weight:600;margin-top:.25rem}
.top p{margin:.5rem 0 0;max-width:52ch;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.step h2{font-size:1.15rem;margin-bottom:.8rem}
.sel{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:.8rem}
.seg button{border:0;background:var(--bg);padding:.5rem .9rem;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:1rem}
.strip button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.25rem .5rem;font-size:.8rem;font-weight:600;min-width:2.9rem;min-height:34px;color:var(--muted)}
.strip button.in{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.strip button.end{background:var(--accent);color:var(--accent-fg)}
.legend{font-size:.82rem;color:var(--muted);margin:.6rem 0 0}
h2.sect{font-size:1.05rem;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mod:hover:not([disabled]){border-color:var(--accent)}
.mod[disabled]{opacity:.5;cursor:not-allowed}
.mod b{font-size:1.05rem}
.mod .d{color:var(--muted);font-size:.9rem}
.mod .m{margin-top:auto;padding-top:6px;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}

/* Réglages */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:.4rem 0;min-height:44px}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvl{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-width:0}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl b{display:flex;align-items:center;gap:8px}
.lvl small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.l1{background:var(--lv1)}.l2{background:var(--lv2)}.l3{background:var(--lv3)}.l4{background:var(--lv4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:.4rem 1rem;font-weight:600;min-height:42px;min-width:52px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.setup .card+.card{margin-top:14px}
.setup h3{font-size:1rem;margin-bottom:.7rem}
.note{font-size:.88rem;color:var(--muted);margin:.7rem 0 0}
.banner{border-radius:10px;padding:.7rem .9rem;font-size:.9rem;background:var(--mid-soft);color:var(--fg);margin-bottom:12px;border:1px solid transparent}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.qbar .line1{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qmeta{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.prog{height:6px;border-radius:99px;background:var(--surface2);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.confirm{background:var(--bad-soft);border-radius:10px;padding:.8rem 1rem;margin:12px 0 0}
.confirm p{margin:0 0 .6rem}
.q{margin-top:16px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.tag{font-size:.75rem;font-weight:600;border-radius:6px;padding:.1rem .5rem;background:var(--surface2);color:var(--muted)}
.qtext{font-family:var(--font-read);font-size:1.3rem;line-height:1.4;margin:0 0 1rem;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:.8rem .9rem;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.vf{grid-template-columns:1fr 1fr}
.vf .opt{justify-content:center;font-weight:700;font-size:1.1rem}
textarea.ans,input.ans{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:.75rem .9rem;resize:vertical}
textarea.ans{min-height:110px;font-family:var(--font-read);font-size:1.05rem;line-height:1.45}
.cloze{font-family:var(--font-read);font-size:1.2rem;line-height:2.3}
input.blank{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:.1rem .4rem;font-family:var(--font-ui);font-size:1rem;text-align:center;max-width:100%}
.blank-ok{border-bottom:2px solid var(--ok);background:var(--ok-soft);padding:0 .35rem;border-radius:6px 6px 0 0;font-family:var(--font-ui);font-size:1rem;font-weight:600}
.blank-bad{border-bottom:2px solid var(--bad);background:var(--bad-soft);padding:0 .35rem;border-radius:6px 6px 0 0;font-family:var(--font-ui);font-size:1rem;font-weight:600}
.fix{font-family:var(--font-ui);font-size:.85rem;color:var(--ok);font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:.5rem}
.bank button{border:1.5px dashed var(--line);background:var(--bg);border-radius:8px;padding:.3rem .7rem;min-height:38px}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center}
.pair .l{font-weight:600}
.pair .ok{color:var(--ok);font-size:.88rem;grid-column:1/-1}
.pair select{width:100%;min-width:0;padding:.55rem .6rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.pair select.good{border-color:var(--ok);background:var(--ok-soft)}
.pair select.bad{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.pair{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.1rem;justify-content:space-between;align-items:center}
.hint{color:var(--bad);font-size:.88rem;margin:.6rem 0 0}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1.5px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.mid{background:var(--mid-soft);border-color:var(--mid)}
.fb.ko{background:var(--bad-soft);border-color:var(--bad)}
.fb .st{font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:.4rem}
.fb.ok .st{color:var(--ok)}.fb.mid .st{color:var(--mid)}.fb.ko .st{color:var(--bad)}
.fb p{margin:.35rem 0}
.corr{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.corr h4,.rev h4{margin:0 0 .35rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.corr p{margin:.3rem 0}
.rev{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.rev ul{margin:.2rem 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rev li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rev .pg{font-size:.82rem;font-weight:700;color:var(--accent)}
.mine{background:var(--bg);border-radius:10px;padding:.7rem .9rem;margin:.4rem 0;font-family:var(--font-read);white-space:pre-wrap;overflow-wrap:anywhere}
.override{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:.88rem}
.override .seg{margin-top:0}
.checks{display:grid;gap:8px;margin:.5rem 0 0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.checks input{margin-top:.25rem;width:1.1rem;height:1.1rem;flex:none}

/* Résultats */
.res{text-align:center;padding:26px 18px}
.big{font-family:var(--font-read);font-size:clamp(2.6rem,10vw,3.8rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.45em;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:16px auto 0;max-width:360px}
.bar i{display:block;height:100%;background:var(--accent)}
.res p{margin:.7rem 0 0}
.todo{margin-top:16px;text-align:left}
.todo ul{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:8px}
.todo li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--bg)}
.todo .cnt{font-size:.78rem;font-weight:700;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:.05rem .45rem}
details.miss{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
details.miss summary{padding:.7rem .9rem;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;justify-content:space-between;align-items:baseline}
details.miss summary::-webkit-details-marker{display:none}
details.miss .in{padding:0 .9rem .9rem}
details.miss .in p{margin:.35rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap"><div id="app"></div></div>

<script>
const BANK={};
// QCM : [section, question, bonneReponse, [3 mauvaises], explication]
BANK.qcm = {
1: [
['intro','Combien de sens principaux du mot « nature » le cours distingue-t-il ?','Trois',['Deux','Quatre','Cinq'],'Sens 1 : l’ensemble de l’Univers ; sens 2 : ce qui obéit à des lois nécessaires ; sens 3 : l’essence d’une chose.'],
['intro','Que veut dire « polysémique » ?','Qui a plusieurs sens',['Qui n’a aucun sens','Qui est universel','Qui s’oppose à la culture'],'Le mot « nature » est polysémique : il a plusieurs sens différents (Univers, lois nécessaires, essence).'],
['intro','Dans le sens 1, la nature s’oppose à…','La culture et à l’artificiel',['Au nécessaire','À l’essence','Aux lois de la physique'],'Sens 1 : réalité indépendante de l’activité humaine, qui s’oppose à la culture (arts, travail, technique, religion) et à l’artificiel. Exemple : une forêt vs une ville.'],
['prob','Selon la problématique, notre rapport à la nature est…','Non neutre : il est aussi prescriptif (elle sert de norme)',['Purement descriptif','Purement scientifique','Sans conséquence morale'],'Notre rapport à la nature ne relève pas seulement de la description (ce qu’est la nature) mais de la prescription (ce qu’il est bon de faire). Ce qui est « naturel » est jugé légitime.'],
['1.1','Que désigne le « kosmos » chez les Grecs ?','Un ordre harmonieux (et une beauté)',['Un désordre menaçant','La démesure','Une vertu de l’âme'],'Kosmos a un double sens : ornement/beauté ET ordre/organisation (Brague : la beauté résultant de l’ordre ; cosmétique).'],
['1.1','Quel mythe illustre l’hubris (la démesure) ?','Icare',['Hadès','Poséidon','Éros'],'Icare (ailes brûlées), Arachné (changée en araignée) et Niobé illustrent la démesure, qui conduit au chaos.'],
['1.1','Quelle vertu est fondamentale chez Platon ?','La tempérance',['L’hubris','Le chaos','La témérité'],'Tempérance (sôphrosunè) : maîtrise de soi, harmonie des désirs sous la conduite de la raison.'],
['1.2','Pour Aristote, la nature est un principe interne de…','Mouvement et de repos',['Désordre et de chaos','Domination et d’exploitation','Habitude et de croyance'],'Aristote : la nature (phusis) est un principe interne de mouvement et de repos : chaque être possède en lui-même la source de son développement.'],
['1.2','Que signifie « télos » ?','La fin, le but vers lequel tend un être',['L’origine d’un être','Le désordre du monde','La croyance née de l’habitude'],'Chaque être naturel est orienté vers une fin (télos) = sa forme accomplie et la plus excellente (graine → fleur).'],
['1.3.1','Qui écrit : « Tout est bien sortant des mains de l’Auteur des choses, tout dégénère entre les mains de l’homme » ?','Rousseau',['Hume','Mill','Freud'],'Rousseau, Émile (1762). La nature sert de point de référence pour critiquer les dérives de la civilisation.'],
['1.3.2','Quelle formule résume le darwinisme social de Spencer ?','« Survival of the fittest »',['« Homo homini lupus »','« Connais-toi toi-même »','« La Nature, ça n’existe pas ! »'],'Spencer étend la sélection au social avec la formule « survival of the fittest » (la survie du plus apte).'],
['2.2','Qui veut nous rendre « comme maîtres et possesseurs de la nature » ?','Descartes',['Aristote','Rousseau','Platon'],'Descartes, Discours de la méthode : connaître les lois de la nature pour mieux agir sur elle, la dominer et l’exploiter.'],
['3.1','Quel anthropologue a écrit « Par-delà nature et culture » (2005) ?','Philippe Descola',['William Cronon','Arne Næss','Alexandre Koyré'],'Philippe Descola, anthropologue, travaux auprès des Achuar d’Amazonie.'],
['3.2.2','Quel écosystème espagnol a obtenu la personnalité juridique en 2022 ?','La Mar Menor',['Les Pyrénées','Le Tage','La forêt amazonienne'],'La Mar Menor, lagune du sud-est de l’Espagne, a reçu la personnalité juridique en 2022 : elle a des droits propres et des représentants peuvent agir en justice en son nom.'],
],
2: [
['intro','Dans le sens 2 (lois nécessaires), la nature s’oppose…','Au contingent, à l’accident',['À la culture','À l’essence','À l’Univers'],'Sens 2 : ce qui obéit à des lois nécessaires (gravité, digestion, génétique) s’oppose au contingent (ce qui pourrait être autrement, comme les lois politiques).'],
['intro','Pourquoi « l’homme s’oppose à la nature » et « l’homme fait partie de la nature » ne se contredisent-ils pas ?','Ce sont deux sens différents du mot « nature » (sens 1 et sens 2)',['Parce que l’un des deux énoncés est faux','Parce que le premier est scientifique et le second poétique','Parce que le cours change d’avis'],'Sens 1 : l’humain est opposé à la nature (il fait de la culture). Sens 2 : il fait partie de la nature (il obéit à la gravité comme le reste).'],
['prob','Quelle contradiction le cours relève-t-il dans l’usage de la nature comme norme ?','On l’a invoquée pour justifier l’esclavage ET pour défendre des droits contre l’injustice',['Elle prouve que l’homme est bon','Elle oppose Grecs et Modernes','Elle sert seulement aux scientifiques'],'Au nom de la nature, on a justifié l’esclavage (infériorité « naturelle ») ET défendu des révoltes (droits naturels, désobéissance civile).'],
['1.1','Que signifie « Connais-toi toi-même » chez Socrate, d’après le cours ?','Comprendre sa place dans le bel ordre du monde',['Pratiquer l’introspection psychologique','Dominer les autres','Se rendre maître de la nature'],'Sens non psychologique : comprends ta place dans le bel ordre (cosmos) et mène une vie conforme à celui-ci.'],
['1.1','Dans l’âme platonicienne, quelle partie siège dans la tête et gouverne l’ensemble ?','La partie rationnelle (noûs)',['La partie irascible (thumos)','La partie désirante (epithumia)','La partie végétative'],'Rationnelle : tête, gouverner l’ensemble, rois-philosophes. Irascible : cœur, soldats. Désirante : ventre, producteurs.'],
['1.1','À quelle classe de la cité correspond la partie irascible de l’âme ?','Les soldats',['Les rois-philosophes','Les producteurs / paysans','Les prêtres'],'Irascible (thumos) : cœur, courage et colère, doit soutenir la raison → les soldats.'],
['1.2','Quelle est la fonction propre de l’homme selon Aristote ?','Une activité rationnelle',['La survie physique','La domination de la nature','La production de richesses'],'L’homme se distingue par la raison (réfléchir, délibérer, choisir) → sa fonction propre est une activité rationnelle.'],
['1.2','Entre quels deux vices se situe le courage ?','Lâcheté (défaut) et témérité (excès)',['Avarice et prodigalité','Apathie et colère excessive','Rudesse et complaisance excessive'],'Courage = juste milieu entre lâcheté et témérité. Tempérance : insensibilité / débauche. Générosité : avarice / prodigalité.'],
['1.3.1','Pour Rousseau, les arts et les sciences sont condamnés…','Pour leurs effets (luxe, oisiveté, hypocrisie), pas en eux-mêmes',['En eux-mêmes, car ils sont faux','Parce qu’ils sont trop difficiles','Parce qu’ils expliquent trop la nature'],'Le progrès intellectuel n’a pas rendu les hommes meilleurs mais plus corrompus : luxe, oisiveté, raffinement qui éloignent de la simplicité naturelle.'],
['1.3.2','Que montre l’exemple de la phalène du bouleau ?','La sélection naturelle : les mieux adaptés survivent et transmettent leurs caractères',['L’harmonie parfaite du cosmos','Une finalité morale de la nature','L’anthropomorphisme de l’homme'],'Darwin : variations + sélection → adaptation. La nature met en avant sélection et différenciation, des mécanismes sans finalité morale.'],
['2.1.1','Quel est l’argument central de Mill dans La Nature (1874) ?','Si le cours naturel était parfait, toute action humaine serait une ingérence inutile',['La nature est parfaite : imitons-la','La nature est une machine muette','L’homme est un loup pour l’homme'],'Or nous admirons les victoires de l’art sur la nature (ponts, digues, paratonnerres…) : il faut soumettre les voies de la nature et non leur obéir.'],
['2.2','Que désigne Koyré par « le divorce » dans le monde moderne ?','Le divorce entre le monde des valeurs et le monde des faits',['Le divorce entre l’âme et le corps','Le divorce entre Grecs et Modernes','Le divorce entre science et religion'],'Rejet de toute considération de valeur, perfection, harmonie, sens ou fin : c’est exactement le problème être / devoir-être.'],

3: [
['intro','Quel énoncé décrit correctement le sens 3 de la nature ?','Les propriétés qui définissent un être et le distinguent de ce qu’il n’est pas (principe d’identité)',['L’ensemble de l’Univers indépendant de l’homme','Ce qui obéit à des lois mathématiques nécessaires','Ce qui est apparu par l’action humaine volontaire'],'Sens 3 : l’essence d’une chose, ses propriétés physiques ou morales. Il permet de penser la limite : elle borne le champ des possibles (ex. être « de nature colérique »).'],

['1.1','Pourquoi les Grecs concluent-ils à un ordre naturel stable ?','Ils observent des régularités frappantes (saisons, marées, un chat engendre un chat)',['Ils pratiquent l’expérimentation mathématique','Ils lisent les lois de Newton','Ils refusent toute observation'],'Régularités → stabilité et constance → monde cohérent, intelligible, ordonné.'],

['1.2','Que signifie le piège « juste milieu ≠ moyenne » ?','Le courage n’est pas un peu de peur : c’est la bonne réaction entre fuir et foncer sans réfléchir',['Il faut toujours choisir la moyenne','Le juste milieu n’existe pas','La vertu est un excès contrôlé'],'Le juste milieu est la bonne réaction, pas une quantité tiède. La vertu est une disposition stable acquise par l’habitude.'],
['1.2','Quelle différence entre Platon et Aristote sur la nature comme norme ?','Platon : la norme vient de l’ordre du cosmos (place de chacun) ; Aristote : de l’intérieur de chaque être (sa fin, sa fonction)',['Platon : de l’intérieur de l’être ; Aristote : du cosmos','Aucun des deux n’y voit une norme','Les deux la tirent des lois mathématiques'],'Chez les deux la nature donne une norme, mais l’origine de la norme diffère : externe/ordre global (Platon) vs interne/fin propre (Aristote).'],
['1.3.1','Quelle est l’origine de la « société du paraître » selon Rousseau ?','L’amour-propre : on se compare et on cherche l’approbation des autres',['L’amour de soi et la pitié','La rationalité scientifique pure','Le retour à l’état de nature'],'L’amour-propre pousse à briller, séduire, être reconnu plutôt qu’être vertueux : hypocrisie généralisée. « Le sauvage vit en lui-même ; l’homme sociable, toujours hors de lui… » (Discours sur l’inégalité, 1755).'],
['1.3.2','Quelle conséquence sociale Spencer tire-t-il de la sélection naturelle ?','Le laisser-faire : aider les plus démunis contrarierait la sélection',['L’égalité obligatoire','L’assistance publique obligatoire','La redistribution des richesses'],'Il accepte l’assistance privée et volontaire mais refuse l’assistance publique et obligatoire. Darwinisme social = explication ET justification des inégalités.'],

['3.2.2','Pourquoi le cours propose-t-il de reconnaître des droits à la nature ? Donne un exemple.',[['Crise écologique : exploitation illimitée, 6e extinction de masse',['extinction','crise','exploitation','ecolog','biodiversit']],['Deep ecology : valeur intrinsèque des êtres vivants, critique de l’anthropocentrisme',['deep','naess','intrinsec','anthropocentr']],['Extension historique des sujets de droit (esclaves, femmes, enfants)',['sujet','esclave','femme','enfant','historique','elargi']],['Exemple : la Mar Menor (personnalité juridique en 2022)',['mar menor','2022','personnalite']]],'L’exploitation illimitée met en danger la vie sur Terre (6e extinction de masse). La deep ecology (Næss) affirme la valeur intrinsèque du vivant. Comme la catégorie des sujets de droit s’est élargie (esclaves, femmes, enfants), on peut reconnaître des droits à la nature : la Mar Menor a obtenu la personnalité juridique en 2022.'],

2: [
['1.2','Montre comment Aristote fait de la nature une norme, sans qu’il faille « imiter aveuglément » ce qui existe.',[['La nature est un principe interne de mouvement et de repos, orienté vers une fin (télos)',['interne','telos','fin','mouvement']],['Un être est « bon » quand il accomplit sa fonction propre (norme interne)',['fonction','accompl','bon','interne']],['Pour l’homme : fonction propre = activité rationnelle, vertu, juste milieu, eudaimonia',['raison','vertu','juste milieu','eudaimonia','vie bonne']],['La nature donne une norme d’accomplissement, pas un modèle à copier',['accomplissement','pas imiter','norme']]],'Pour Aristote, chaque être naturel est orienté vers sa fin (télos) : comprendre sa nature, c’est comprendre sa fonction propre. Un bon cheval est celui qui accomplit sa nature. L’homme, être de raison, doit réaliser une vie rationnelle, équilibrée et vertueuse (juste milieu). La nature est donc norme interne d’accomplissement, non modèle à imiter aveuglément.'],
['1.3.1','Pourquoi Rousseau dit-il que l’homme s’est « éloigné de sa nature » ? Que reproche-t-il aux arts et sciences ?',[['Les arts et sciences n’ont pas rendu les hommes meilleurs mais plus corrompus (luxe, oisiveté)',['corrompu','luxe','oisivet','meilleur']],['Société du paraître : amour-propre, distinction sociale, hypocrisie',['paraitre','amour-propre','hypocrisie','distinction']],['Besoins limités de l’homme naturel vs désirs artificiels et infinis',['besoin','desir','artificiel','infini']],['La nature est un point de référence critique, pas un modèle à imiter',['reference','mesure','critique','pas imiter','retour']]],'Rousseau défend que le progrès des arts et des sciences n’a pas rendu les hommes meilleurs mais plus corrompus. L’amour-propre crée une société du paraître et de l’hypocrisie ; l’homme civilisé a des désirs artificiels et infinis, l’homme naturel des besoins limités. La nature sert de mesure pour critiquer la civilisation, pas de modèle à imiter.'],
['1.3.2','Pourquoi le darwinisme social de Spencer est-il critiquable ? Donne deux critiques du cours.',[['On ne peut pas déduire une norme morale de l’observation des faits (Hume, être/devoir-être)',['hume','deduire','norme','fait','etre','devoir']],['Il naturalise les inégalités : présente comme nécessaire ce qui relève de choix politiques et sociaux',['naturalis','inegalit','choix','politique','social']],['Interprétation réductrice de Darwin : coopération, instincts sociaux, entraide (Kropotkine)',['reducteur','cooperation','entraide','kropotkine','instinct','filiation']],['Transposition contestable du vivant au social',['transposition','vivant']]],'Le darwinisme social transpose la sélection du vivant au social, et justifie les inégalités comme résultat naturel. On peut lui objecter (Hume) qu’on ne déduit pas une norme d’un fait, qu’il naturalise des rapports de domination qui relèvent de choix politiques, et qu’il néglige l’entraide et les instincts sociaux montrés par Darwin et Kropotkine.'],
['2.3.2','Expose la critique de Hume sur l’ordre naturel et explique pourquoi elle remet en cause l’idée de nature-modèle.',[['Nous n’observons que des faits qui se succèdent, jamais la nécessité',['succede','regulier','necessite','jamais','faits']],['La causalité est une croyance produite par l’habitude (instinct, impossible à prouver)',['habitude','croyance','instinct','prouver','scepticisme']],['L’ordre naturel est peut-être une projection de notre besoin de régularité',['projection','besoin','regularit']],['La nature n’est pas un livre déjà écrit : en imitant la nature on imite ses propres projections',['livre','confond','projections','image','miroir']]],'Pour Hume, nous ne percevons jamais les « lois » de la nature ni la nécessité, seulement des faits qui se succèdent régulièrement. La causalité est une croyance née de l’habitude. L’ordre naturel qu’on voudrait prendre pour modèle est donc peut-être une projection de notre besoin de régularité : en croyant imiter la nature, l’homme imite l’image qu’il s’en fait.'],
],
3: [
['1.1','Compare l’âme et la cité chez Platon, et explique en quoi la tempérance reproduit l’ordre du monde.',[['Trois parties : rationnelle (tête, gouverner), irascible (cœur, courage), désirante (ventre, désirs)',['rationnelle','irascible','desirante','noûs','nous','thumos','epithumia']],['Trois classes : rois-philosophes, soldats, producteurs',['roi','philosophe','soldat','producteur','paysan']],['La tempérance : chaque partie reste à sa place et remplit sa fonction',['place','fonction','temperance']],['Cela reproduit l’ordre du cosmos : ordre respecté → âme harmonieuse, juste',['cosmos','harmon','juste','ordre','nature']]],'Chez Platon, l’âme a trois parties (rationnelle, irascible, désirante) qui correspondent aux trois classes de la cité (rois-philosophes, soldats, producteurs). La tempérance consiste à ce que chaque partie reste à sa place et remplisse sa fonction : l’âme est alors harmonieuse et juste, ce qui reproduit en l’homme l’ordre du monde.'],
['1.2','Compare Platon et Aristote : d’où vient la norme que donne la nature ?',[['Chez Platon : la norme vient de l’ordre du cosmos (place de chacun)',['platon','cosmos','ordre','place']],['Chez Aristote : la norme vient de l’intérieur de chaque être (sa fin, sa fonction)',['aristote','interne','interieur','fin','fonction']],['Point commun : la nature donne bien une norme',['norme','commun','tous les deux','deux']],['Schéma aristotélicien : nature → fonction propre → vertu → vie bonne',['fonction propre','vertu','vie bonne','schema']]],'Chez Platon, la norme est externe et globale : elle vient de l’ordre du cosmos, où chacun a sa place. Chez Aristote, elle est interne : chaque être porte en lui sa fin et sa fonction propre. Dans les deux cas la nature donne une norme. Schéma aristotélicien : nature → fonction propre → excellence (vertu) → vie bonne.'],
[['2.1.1','2.1.2'],'Compare les deux manières dont Mill (nature extérieure) et Freud (nature intérieure) montrent que la nature n’est pas un modèle.',[['Mill : l’action humaine (ponts, digues, médecine) corrige les imperfections de la nature',['mill','pont','digue','medecine','corrige','imperfection']],['Faire de la nature un modèle est contradictoire avec l’éloge de la civilisation',['contradict','eloge','civilisation','paradoxe']],['Freud : la nature intérieure est faite de pulsions et d’agressivité (homo homini lupus)',['freud','pulsion','agress','loup']],['La civilisation contraint et corrige la nature humaine (renoncement pulsionnel)',['contrainte','corrige','renoncement','interdit','refoul']]],'Mill et Freud disent la même chose à deux échelles : nature extérieure (inondations, foudre → techniques) et nature intérieure (pulsions → morale et lois). Pour Mill, tout éloge de la civilisation est une critique de la nature. Pour Freud, la civilisation corrige et contraint une nature humaine agressive. Dans les deux cas, la culture va contre la nature.'],
['2.4','Pourquoi le recours à la nature comme norme peut-il être dangereux ? Appuie-toi sur un exemple du cours.',[['Il produit des normes sur ce que les individus doivent être, présentées comme nécessaires et immuables',['norme','necessaire','immuable','evident']],['Exemple : la « nature féminine » et l’essentialisation',['feminin','femme','essentialis']],['Exemple : l’homosexualité « contre-nature » ; naturel ≠ bon ; référence sélective',['homosexual','contre','selectif','frequent']],['La nature devient un instrument de légitimation qui empêche de contester les rapports sociaux',['legitimation','instrument','ideologi','incontestable','exclu','imposer']]],'Faire de la nature une norme donne aux choix historiques et culturels l’apparence de vérités objectives. L’exemple de la « nature féminine » (essentialisation) ou celui de l’homosexualité jugée « contre-nature » montrent une référence sélective, orientée par des préjugés. Naturel ≠ bon : la nature devient un instrument de légitimation qui fige les identités et exclut.'],
],
4: [
['prob','En t’appuyant sur la problématique, explique pourquoi « la nature comme norme » pose le problème être / devoir-être.',[['Notre rapport à la nature est non neutre : description et prescription',['description','prescription','non neutre']],['Ce qui est « naturel » est jugé légitime, ce qui est « contre nature » rejeté',['naturel','legitime','contre nature','rejet']],['Passage illégitime de « la nature est ainsi » à « il faut faire ainsi » (critique de Hume)',['hume','etre','devoir','fait','norme']],['Contradiction : esclavage justifié et droits naturels ; ambivalence : se conformer ou dominer',['esclavage','droits naturels','ambivalence','dominer','conformer']]],'On passe trop vite de la description (ce qu’est la nature) à la prescription (ce qu’il faut faire). Ce qui est naturel est jugé légitime, ce qui est contre nature rejeté. La nature a justifié l’esclavage et les droits naturels : son usage est contradictoire et ambivalent (se conformer ou dominer). Hume rappelle qu’on ne déduit pas une norme d’un fait.'],
[['1.3.1','1.3.2'],'Rousseau et Spencer invoquent tous deux la nature : montre ce qui les oppose dans leur usage de la nature comme norme.',[['Rousseau : la nature est un modèle critique de la société (homme naturel, pitié, simplicité)',['rousseau','critique','pitie','simplicite','denature']],['Spencer : la nature (sélection, concurrence) est un modèle pour organiser la société',['spencer','selection','concurrence','survival']],['Rousseau dénonce les inégalités sociales comme dégénérescence ; Spencer les justifie comme résultat naturel',['inegalit','justifi','denonce','degenerescence','naturel']],['Les deux conceptions de la nature diffèrent : état originel perdu / lieu de lutte et sélection',['originel','lutte','etat','varient','conception']]],'Pour Rousseau, la nature est un point de référence critique : l’homme naturel simple et pitoyable contraste avec la société du paraître, productrice d’inégalités. Pour Spencer, la nature est lutte et sélection, et sert à justifier les inégalités. Ce contraste illustre la transition I → II : les conceptions de la nature varient selon les auteurs (état originel perdu vs lieu de lutte).'],
['2.2','Explique ce que Koyré appelle le « divorce entre le monde des valeurs et le monde des faits » et son lien avec l’être/devoir-être.',[['Passage du cosmos fini et hiérarchisé à l’univers infini, homogène, sans centre',['cosmos','infini','homogene','centre','univers']],['Destruction du Cosmos + géométrisation de l’espace',['destruction','geometris','espace']],['Rejet des notions de valeur, perfection, harmonie, sens ou fin',['valeur','perfection','harmonie','sens','fin']],['Si le monde n’est que fait mesurable, on ne peut plus lire de norme dans la nature (être/devoir-être)',['norme','etre','devoir','fait','muette','objet']]],'Chez Koyré, la révolution scientifique détruit le Cosmos et géométrise l’espace : l’univers est infini, homogène, régi par les mêmes lois. Valeur, perfection, harmonie, fin sont rejetées : divorce entre monde des valeurs et monde des faits. La nature, objectivée et « muette », ne prescrit plus : on ne peut plus lire de norme dans les faits.'],
['3.1','Explique la thèse de Descola « La Nature, ça n’existe pas ! » et présente les quatre ontologies par leurs deux critères.',[['L’opposition nature/culture est propre au dualisme occidental moderne (naturalisme)',['dualisme','occident','naturalisme','construction']],['Deux critères : physicalité (corps) et intériorité (âme/conscience)',['physicalit','interior','corps','ame']],['Naturalisme (même corps, âme différente) ; animisme (corps différent, même âme)',['naturalisme','animisme']],['Totémisme (même corps, même âme) ; analogisme (ni l’un ni l’autre)',['totem','analog']]],'Pour Descola, la séparation nature/culture est propre au naturalisme occidental moderne. Il distingue quatre ontologies selon la physicalité et l’intériorité : naturalisme (mêmes corps, âmes différentes), animisme (corps différents, même âme), totémisme (mêmes corps, même âme), analogisme (ni l’un ni l’autre). La « Nature » n’est donc pas universelle.'],
],

/* ---------- Utilitaires ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function hasKw(text,kw){const t=' '+text+' ',k=norm(kw);if(!k)return false;return k.length<=4?t.indexOf(' '+k)>=0:t.indexOf(k)>=0;}
function groupsMatched(text,groups){const t=norm(text);return groups.map(g=>g.some(k=>hasKw(t,k)));}
function modItems(mod){return mod==='mix'?ITEMS.filter(i=>i.m!=='refl'):ITEMS.filter(i=>i.m===mod);}
function secIdx(){return prefs.sel?IDX[prefs.sel]:-1;}
function inRange(it){if(!prefs.sel)return false;if(prefs.only)return it.secs.indexOf(prefs.sel)>=0;const mx=IDX[prefs.sel];return it.secs.every(s=>IDX[s]<=mx);}
function avail(mod,level){return modItems(mod).filter(i=>inRange(i)&&(level==null||i.l===level)).length;}
function seenSet(){return new Set(store.get('nat_seen_v1',[]));}
function rangeLabel(){if(!prefs.sel)return '';const s=SECTIONS[IDX[prefs.sel]];return (prefs.only?'Uniquement ':'Jusqu’à ')+(prefs.sel)+(prefs.only?'':' inclus');}
function pagesFor(it){return it.secs.map(id=>SECTIONS[IDX[id]]);}

/* ---------- Tirage des questions ---------- */
function pick(mod,level,n){
 const seen=seenSet();
 const all=modItems(mod).filter(inRange);
 const dist=x=>Math.abs(x.l-level);
 const byDist=arr=>{const g={};arr.forEach(x=>(g[dist(x)]=g[dist(x)]||[]).push(x));return Object.keys(g).sort((a,b)=>a-b).reduce((acc,k)=>acc.concat(shuffle(g[k])),[]);};
 const same=all.filter(x=>x.l===level), other=all.filter(x=>x.l!==level);
 const tiers=[
  shuffle(same.filter(x=>!seen.has(x.id))),
  byDist(other.filter(x=>!seen.has(x.id))),
  shuffle(same.filter(x=>seen.has(x.id))),
  byDist(other.filter(x=>seen.has(x.id)))
 ];
 const chosen=[];let otherLvl=0,again=0;
 tiers.forEach((t,ti)=>{for(const x of t){if(chosen.length>=n)break;chosen.push(x);if(x.l!==level)otherLvl++;if(seen.has(x.id))again++;}});
 return {items:shuffle(chosen),otherLvl:otherLvl,again:again,total:all.length};
}
function prepare(it){
 const o=Object.assign({},it);
 if(it.m==='qcm'){o.opts=shuffle([{t:it.ok,c:true}].concat(it.bad.map(b=>({t:b,c:false}))));}
 if(it.m==='assoc'){o.rights=shuffle(it.pairs.map(p=>p[1]));}
 if(it.m==='trous'){o.bank=shuffle(it.ans.map(a=>a[0]).concat(it.d));}
 return o;
}
function startSeries(){
 const p=pick(setup.mod,setup.level,setup.n);
 S={mod:setup.mod,level:setup.level,n:p.items.length,req:setup.n,items:p.items.map(prepare),i:0,log:[],cur:null,sel:null,
    otherLvl:p.otherLvl,again:p.again,quit:false,msg:''};
 view='quiz';render();
}

/* ---------- Correction ---------- */
function gradeText(it,txt){
 const g=groupsMatched(txt,it.k);const got=g.filter(Boolean).length;
 const need=it.need||(it.k.length<=2?it.k.length:Math.ceil(it.k.length*0.66));
 let pts=0;if(txt.trim()){if(got>=need)pts=1;else if(got>0&&got>=need/2)pts=0.5;}
 return {pts:pts,got:got,total:it.k.length};
}
function gradeBlank(user,alts){
 const u=norm(user);if(!u)return false;
 return alts.some(a=>{const n=norm(a);return u===n||(n.length>5&&lev(u,n)<=1)||(n.length>9&&lev(u,n)<=2);});
}
function collect(it){
 if(it.m==='qcm'||it.m==='vf')return S.sel;
 if(it.m==='simple'||it.m==='def'||it.m==='refl'){const e=document.getElementById('ans');return e?e.value:'';}
 if(it.m==='trous')return it.ans.map((a,j)=>{const e=document.getElementById('b'+j);return e?e.value:'';});
 if(it.m==='assoc')return it.pairs.map((p,j)=>{const e=document.getElementById('s'+j);return e?e.value:'';});
}
function grade(it,ans,idk){
 const r={ans:ans,idk:!!idk,pts:0,over:false};
 if(it.m==='qcm'){r.pts=(!idk&&ans!=null&&it.opts[ans].c)?1:0;}
 else if(it.m==='vf'){r.pts=(!idk&&ans!=null&&ans===it.a)?1:0;}
 else if(it.m==='simple'||it.m==='def'){const g=gradeText(it,idk?'':ans);r.pts=g.pts;r.got=g.got;r.total=g.total;r.over=true;}
 else if(it.m==='trous'){r.ok=it.ans.map((a,j)=>!idk&&gradeBlank(ans[j],a));r.pts=r.ok.filter(Boolean).length/it.ans.length;r.over=true;}
 else if(it.m==='assoc'){r.ok=it.pairs.map((p,j)=>!idk&&ans[j]===p[1]);r.pts=r.ok.filter(Boolean).length/it.pairs.length;}
 else if(it.m==='refl'){const g=idk?it.pts.map(()=>false):groupsMatched(ans,it.pts.map(p=>p[1]));r.checks=g;r.pts=g.filter(Boolean).length/it.pts.length;}
 return r;
}
function markSeen(it){const s=seenSet();s.add(it.id);store.set('nat_seen_v1',Array.from(s));}
function curPts(){return S.log.reduce((a,l)=>a+l.pts,0)+(S.cur?S.cur.pts:0);}
function answeredCount(){return S.log.length+(S.cur?1:0);}

  h+=t+'</p>'+statusHTML(c.pts)+overrideHTML(c);
 }else if(it.m==='assoc'){
  h+='<div class="pairs">'+it.pairs.map((p,j)=>'<div class="pair"><span class="l">'+esc(p[0])+'</span><select disabled class="'+(r.ok[j]?'good':'bad')+'"><option>'+(esc(r.ans[j])||'(sans réponse)')+'</option></select>'+(r.ok[j]?'':'<span class="ok">Bonne association : '+esc(p[1])+'</span>')+'</div>').join('')+'</div>';
  h+=statusHTML(c.pts);
 }else if(it.m==='refl'){
  h+='<div class="mine">'+(r.idk?'<span class="muted">Tu as passé cette question.</span>':(esc(r.ans)||'<span class="muted">(vide)</span>'))+'</div>';
  h+=statusHTML(c.pts);
  h+='<div class="corr"><h4>Points attendus : coche ceux que ta réponse contient</h4><div class="checks">'+it.pts.map((p,k)=>'<label><input type="checkbox" data-act="chk" data-k="'+k+'"'+(r.checks[k]?' checked':'')+'><span>'+esc(p[0])+'</span></label>').join('')+'</div><p class="muted" style="font-size:.85rem;margin-top:.7rem">Les cases sont pré-cochées d’après les mots-clés trouvés dans ta réponse. Corrige-les si besoin.</p></div>';
  h+='<div class="corr"><h4>Réponse modèle</h4><p>'+esc(it.a)+'</p></div>';
 }
 h+=revHTML(it,c.pts);
 return h;
}
function renderQuiz(){
 const it=S.items[S.i];const done=!!S.cur;
 let h=barHTML();
 if(S.i===0&&!done&&(S.otherLvl||S.again||S.n<S.req)){
  const parts=[];if(S.n<S.req)parts.push('Il n’existe que '+S.n+' questions pour ce réglage.');
  if(S.otherLvl)parts.push(S.otherLvl+' question'+(S.otherLvl>1?'s viennent':' vient')+' d’un niveau voisin, faute de questions inédites ou assez nombreuses au niveau choisi.');
  if(S.again)parts.push(S.again+' question'+(S.again>1?'s ont':' a')+' déjà été vue'+(S.again>1?'s':'')+' : tu as épuisé les inédites.');
  h+='<div class="banner" style="margin-top:12px">'+esc(parts.join(' '))+'</div>';
 }
 h+='<article class="card q"><div class="qhead"><span class="eyebrow">Question '+(S.i+1)+' sur '+S.n+'</span>'+secTags(it)+'</div><h2 class="qtext">'+questionText(it)+'</h2>';
 if(!done){
  h+=askBody(it);
  h+='<div id="hint" class="hint" role="alert"></div><div class="actions"><button class="btn ghost" data-act="idk">Je ne sais pas</button><button class="btn primary" data-act="validate">Valider</button></div>';
 }else{
  h+=doneBody(it);
  h+='<div class="actions"><span></span><button class="btn primary" id="next" data-act="next">'+(S.i+1>=S.n?'Voir mon résultat':'Question suivante')+'</button></div>';
 }
 h+='</article>';
 $app.innerHTML=h;
 window.scrollTo(0,0);
 if(done){const n=document.getElementById('next');if(n)n.focus({preventScroll:true});}
 else{const f=document.querySelector('#ans,.blank');if(f)f.focus({preventScroll:true});}
}
function validate(idk){
 const it=S.items[S.i];
 let ans=collect(it);
 if(!idk){
  let empty=false;
  if(it.m==='qcm'||it.m==='vf')empty=(ans==null);
  else if(it.m==='trous')empty=ans.every(a=>!a.trim());
  else if(it.m==='assoc')empty=ans.every(a=>!a);
  else empty=!String(ans).trim();
  if(empty){const hh=document.getElementById('hint');if(hh)hh.textContent=(it.m==='qcm'||it.m==='vf')?'Choisis une réponse, ou clique sur « Je ne sais pas ».':'Réponds d’abord, ou clique sur « Je ne sais pas ».';return;}
 }
 S.cur=grade(it,ans,idk);
 markSeen(it);
 renderQuiz();
}
function next(){
 const it=S.items[S.i];
 S.log.push({it:it,pts:S.cur.pts,ans:S.cur.ans,idk:S.cur.idk});
 S.cur=null;S.sel=null;S.i++;
 if(S.i>=S.n){finish();}else renderQuiz();
}
function finish(){
 const pts=curPts();
 const hist=store.get('nat_hist_v1',{});hist[S.mod]={pts:pts,n:S.n,level:S.level,at:Date.now()};store.set('nat_hist_v1',hist);
 view='results';render();
}

/* ---------- Rendu : résultats ---------- */
function correctText(it){
 if(it.m==='qcm')return '<p><b>Bonne réponse :</b> '+esc(it.ok)+'</p><p>'+esc(it.e)+'</p>';
 if(it.m==='vf')return '<p><b>C’était '+(it.a?'vrai':'faux')+'.</b></p><p>'+esc(it.e)+'</p>';
 if(it.m==='simple'||it.m==='def'||it.m==='refl')return '<p>'+esc(it.a)+'</p>';
 if(it.m==='trous'){const parts=it.text.split('{}');let t='';parts.forEach((p,i)=>{t+=esc(p);if(i<parts.length-1)t+='<b>'+esc(it.ans[i][0])+'</b>';});return '<p>'+t+'</p>';}
 if(it.m==='assoc')return '<p>'+it.pairs.map(p=>esc(p[0])+' → <b>'+esc(p[1])+'</b>').join('<br>')+'</p>';
}
function plainQ(it){
 if(it.m==='def')return 'Définis : '+it.term;
 if(it.m==='trous')return it.text.replace(/\{\}/g,'…');
 if(it.m==='assoc')return it.title;
 return it.q;
}
function renderResults(){
 const pts=curPts();const pct=Math.round(pts/S.n*100);
 let msg=pct>=90?'Excellent, la partie est bien maîtrisée.':pct>=70?'Solide. Reprends les points ci-dessous pour consolider.':pct>=50?'À consolider : relis les passages signalés.':'À retravailler : repars du cours sur les passages ci-dessous.';
 const miss=S.log.filter(l=>l.pts<1);
 const w={};miss.forEach(l=>l.it.secs.forEach(s=>{w[s]=(w[s]||0)+(1-l.pts);}));
 const order=Object.keys(w).sort((a,b)=>w[b]-w[a]||IDX[a]-IDX[b]);
 const unseen=modItems(S.mod).filter(i=>inRange(i)&&!seenSet().has(i.id)).length;
 let h='<div class="top" style="padding-bottom:10px"><div class="eyebrow">'+esc(MOD[S.mod].name)+' · '+LEVELS[S.level-1].name+' · '+esc(rangeLabel())+'</div><h1>Fin de la série</h1></div>';
 h+='<section class="card res"><div class="big">'+fmt(pts)+'<small> / '+S.n+'</small></div><div class="bar"><i style="width:'+pct+'%"></i></div><p><b>'+pct+' %</b> · '+esc(msg)+'</p></section>';
 if(order.length){
  h+='<section class="card todo"><h3 style="font-size:1rem">Où réviser en priorité</h3><ul>'+order.map(id=>{const s=SECTIONS[IDX[id]];const c=miss.filter(l=>l.it.secs.indexOf(id)>=0).length;return '<li><span class="cnt">'+c+' erreur'+(c>1?'s':'')+'</span><b>§ '+id+' · '+s.p+'</b><span>'+esc(s.n)+'</span></li>';}).join('')+'</ul></section>';
  h+='<h2 class="sect">Tes erreurs corrigées</h2>'+miss.map(l=>'<details class="miss"><summary><span>'+esc(plainQ(l.it))+'</span><span class="tag">'+(l.pts>0?'partiel':'faux')+'</span></summary><div class="in">'+correctText(l.it)+'<p class="muted" style="font-size:.88rem">À revoir : '+pagesFor(l.it).map(s=>'§ '+s.id+' ('+s.p+')').join(', ')+'</p></div></details>').join('');
 }else h+='<p class="note" style="text-align:center">Aucune erreur sur cette série.</p>';
 h+='<p class="note" style="margin-top:18px">'+(unseen>0?'Il reste '+unseen+' question'+(unseen>1?'s':'')+' inédite'+(unseen>1?'s':'')+' pour ce réglage.':'Tu as vu toutes les questions de ce réglage : certaines reviendront.')+'</p>';
 h+='<div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="again">↻ Nouvelles questions</button><button class="btn" data-act="settings">Changer les réglages</button><button class="btn ghost" data-act="home">Accueil</button></div>';
 $app.innerHTML=h;window.scrollTo(0,0);
}

function render(){
 if(view==='home')renderHome();else if(view==='setup')renderSetup();else if(view==='quiz')renderQuiz();else renderResults();
 if(view!=='quiz'&&view!=='results')window.scrollTo(0,0);
}

/* ---------- Événements ---------- */
function savePrefs(){store.set('nat_prefs_v1',prefs);}
$app.addEventListener('click',function(e){
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const a=t.getAttribute('data-act'),v=t.getAttribute('data-v');
 switch(a){
  case 'sec':prefs.sel=v;savePrefs();renderHome();break;
  case 'only':prefs.only=v==='1';savePrefs();renderHome();break;
  case 'mod':if(!prefs.sel)return;setup.mod=v;setup.n=Math.min(setup.n,avail(v))||setup.n;view='setup';render();break;
  case 'level':setup.level=+v;renderSetup();break;
  case 'count':setup.n=+v;renderSetup();break;
  case 'start':startSeries();break;
  case 'home':S=null;view='home';render();break;
  case 'reset-ask':confirmReset=true;renderHome();break;
  case 'reset-no':confirmReset=false;renderHome();break;
  case 'reset-yes':store.set('nat_seen_v1',[]);store.set('nat_hist_v1',{});confirmReset=false;renderHome();break;
  case 'pick':S.sel=(v==='true')?true:(v==='false')?false:+v;
   document.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));break;
  case 'chip':{const b=Array.from(document.querySelectorAll('.blank')).find(i=>!i.value.trim())||document.querySelector('.blank:last-of-type');if(b){b.value=v;b.focus();}break;}
  case 'validate':validate(false);break;
  case 'idk':validate(true);break;
  case 'over':S.cur.pts=+v;renderQuiz();break;
  case 'next':next();break;
  case 'quit':if(!S.log.length&&!S.cur){S=null;view='home';render();}else{S.quit=true;renderQuiz();}break;
  case 'quit-no':S.quit=false;renderQuiz();break;
  case 'quit-yes':S=null;view='home';render();break;
  case 'again':startSeries();break;
  case 'settings':setup.mod=S.mod;setup.level=S.level;setup.n=S.req;view='setup';render();break;
 }
});
$app.addEventListener('change',function(e){
 const t=e.target;
 if(t.id==='selSec'){prefs.sel=t.value||null;savePrefs();renderHome();}
 if(t.getAttribute&&t.getAttribute('data-act')==='chk'&&S&&S.cur){
  const it=S.items[S.i];S.cur.checks[+t.getAttribute('data-k')]=t.checked;
  S.cur.pts=S.cur.checks.filter(Boolean).length/it.pts.length;renderQuiz();
 }
});
$app.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&view==='quiz'&&S&&!S.cur){
  const t=e.target;
  if(t.tagName==='INPUT'&&(t.id==='ans'||t.classList.contains('blank'))){e.preventDefault();validate(false);}
  else if(t.tagName==='TEXTAREA'&&(e.ctrlKey||e.metaKey)){e.preventDefault();validate(false);}
 }
});

/* Lien vers les tests : état lisible depuis la page */
window.__rev={items:ITEMS,sections:SECTIONS,cur:function(){return S&&S.items[S.i];}};
render();
})();
</script>

</body></html>
